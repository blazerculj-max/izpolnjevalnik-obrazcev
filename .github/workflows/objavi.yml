name: Objavi na GitHub Pages

# Ob vsakem commitu v main se orodje zgradi na novo in objavi.
# Ko zamenjaš obrazec v data/obrazci/, imajo vsi takoj pravega.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Naenkrat naj teče ena objava; morebitne vmesne commite preskočimo.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  zgradi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run zgradi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  objavi:
    needs: zgradi
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.objava.outputs.page_url }}
    steps:
      - id: objava
        uses: actions/deploy-pages@v4
